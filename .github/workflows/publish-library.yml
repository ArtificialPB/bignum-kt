name: Deploy SNAPSHOT and new releases to Maven Central

# Releases are published by release.yml, which calls this workflow with the release tag.
# Tag pushes are deliberately not a trigger so a release can never be deployed twice.
on:
  push:
    branches:
      - master

  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        description: Git ref (tag or commit SHA) to build and publish
        type: string
        required: true

concurrency:
  group: publish-${{ inputs.ref || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'snapshot' }}
  cancel-in-progress: ${{ !inputs.ref && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/environment-setup

      - name: Build project
        run: ./gradlew clean build --no-configuration-cache --no-watch-fs --stacktrace

      - name: Publish artifacts to staging
        run: ./gradlew publish --no-configuration-cache --no-watch-fs --stacktrace

      - name: Deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: ./gradlew jreleaserDeploy --no-configuration-cache --no-watch-fs --stacktrace
